          - paragraph [ref=f24e327]: Nezvedáme? Během stříhání se věnujeme psovi. Prozvoňte nás a ozveme se, jakmile dostříháme.
        - listitem [ref=f24e328]:
          - generic [aria-hidden] [ref=f24e329]: "2"
