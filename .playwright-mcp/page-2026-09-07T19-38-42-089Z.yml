    - generic [ref=f11e295]:
      - generic [ref=f11e296]:
        - heading [level=2] [ref=f11e297]:
          - text: Jak to u mě
          - emphasis [ref=f11e298]: probíhá
        - paragraph [ref=f11e299]: Většina lidí mi volá poprvé a neví, co čekat. Tak ať je jasno předem.
      - list [ref=f11e300]:
        - listitem [ref=f11e301]:
          - generic [aria-hidden] [ref=f11e302]: "1"
          - heading "Zavoláte" [level=3] [ref=f11e303]
          - paragraph [ref=f11e304]: Objednávky beru jedině telefonicky, ať se hned domluvíme na tom, co váš pes potřebuje. Termíny mám obvykle dva až tři týdny dopředu, před Vánoci i déle.
          - paragraph [ref=f11e305]: Nezvedám? Během stříhání se věnuju psovi. Prozvoňte mě a ozvu se, jakmile dostříhám.
        - listitem [ref=f11e306]:
          - generic [aria-hidden] [ref=f11e307]: "2"
          - heading "Co si připravte k telefonu" [level=3] [ref=f11e308]
          - paragraph [ref=f11e309]: "Ušetří nám to oběma pár minut a vám hlavně přesnější cenu a termín:"
          - list [ref=f11e310]:
            - listitem [ref=f11e311]: plemeno a jméno psa, přibližná váha
            - listitem [ref=f11e312]: kdy byl naposledy stříhaný
            - listitem [ref=f11e313]: jak snáší fén, strojek a cizí lidi
            - listitem [ref=f11e314]: jestli je někde zacuchaný
            - listitem [ref=f11e315]: zdravotní omezení, alergie, kožní problémy
            - listitem [ref=f11e316]: jestli je fena hárající nebo pes po operaci
        - listitem [ref=f11e317]:
          - generic [aria-hidden] [ref=f11e318]: "3"
          - heading "Návštěva" [level=3] [ref=f11e319]
          - paragraph [ref=f11e320]: Psa si prohlédnu, potvrdím cenu a pustím se do práce. Koupel a fén trvá 45 až 90 minut, kompletní střih 1,5 až 3 hodiny. V salonu je vždycky jen jeden pes.
          - paragraph [ref=f11e321]: S sebou nic nepotřebujete, jen vodítko a obojek. Před návštěvou psa prosím vyvenčete.
        - listitem [ref=f11e322]:
          - generic [aria-hidden] [ref=f11e323]: "4"
          - heading "Vyzvednutí" [level=3] [ref=f11e324]
          - paragraph [ref=f11e325]: Zavolám vám, jakmile budu hotová. Řeknu vám, co jsem na psovi našla, jak o srst pečovat doma a kdy přijít příště. Platí se hotově nebo QR platbou.
