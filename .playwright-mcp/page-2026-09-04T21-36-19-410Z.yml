          - heading "Zavoláte" [level=3] [ref=f3e308]
          - paragraph [ref=f3e309]: Objednáváme se jedině telefonicky, ať se hned domluvíme na tom, co váš pes potřebuje. Termíny máme obvykle dva až tři týdny dopředu, před Vánoci i déle.
          - paragraph [ref=f3e310]: Nezvedáme? Během stříhání se věnujeme psovi. Prozvoňte nás a ozveme se, jakmile dostříháme.
        - listitem [ref=f3e311]:
          - generic [aria-hidden] [ref=f3e312]: "2"
          - heading "Co si připravte k telefonu" [level=3] [ref=f3e313]
          - paragraph [ref=f3e314]: "Ušetří nám to oběma pár minut a vám hlavně přesnější cenu a termín:"
