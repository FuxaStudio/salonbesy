          - emphasis [ref=f9e285]: probíhá
        - paragraph [ref=f9e286]: Většina lidí mi volá poprvé a neví, co čekat. Tak ať je jasno předem.
      - list [ref=f9e287]:
        - listitem [ref=f9e288]:
          - generic [aria-hidden] [ref=f9e289]: "1"
          - heading "Zavoláte" [level=3] [ref=f9e290]
          - paragraph [ref=f9e291]: Objednávky beru jedině telefonicky, ať se hned domluvíme na tom, co váš pes potřebuje. Termíny mám obvykle dva až tři týdny dopředu, před Vánoci i déle.
          - paragraph [ref=f9e292]: Nezvedám? Během stříhání se věnuju psovi. Prozvoňte mě a ozvu se, jakmile dostříhám.
        - listitem [ref=f9e293]:
          - generic [aria-hidden] [ref=f9e294]: "2"
          - heading "Co si připravte k telefonu" [level=3] [ref=f9e295]
          - paragraph [ref=f9e296]: "Ušetří nám to oběma pár minut a vám hlavně přesnější cenu a termín:"
          - list [ref=f9e297]:
            - listitem [ref=f9e298]: plemeno a jméno psa, přibližná váha
            - listitem [ref=f9e299]: kdy byl naposledy stříhaný
            - listitem [ref=f9e300]: jak snáší fén, strojek a cizí lidi
            - listitem [ref=f9e301]: jestli je někde zacuchaný
            - listitem [ref=f9e302]: zdravotní omezení, alergie, kožní problémy
            - listitem [ref=f9e303]: jestli je fena hárající nebo pes po operaci
        - listitem [ref=f9e304]:
