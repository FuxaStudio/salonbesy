          - heading "Vyzvednutí" [level=3] [ref=f9e311]
          - paragraph [ref=f9e312]: Zavolám vám, jakmile budu hotová. Řeknu vám, co jsem na psovi našla, jak o srst pečovat doma a kdy přijít příště. Platí se hotově nebo QR platbou.
