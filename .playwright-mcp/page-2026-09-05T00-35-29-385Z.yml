          - emphasis [ref=f32e303]: probíhá
        - paragraph [ref=f32e304]: Většina lidí mi volá poprvé a neví, co čekat. Tak ať je jasno předem.
      - list [ref=f32e305]:
        - listitem [ref=f32e306]:
          - generic [aria-hidden] [ref=f32e307]: "1"
          - heading "Zavoláte" [level=3] [ref=f32e308]
          - paragraph [ref=f32e309]: Objednávky beru jedině telefonicky, ať se hned domluvíme na tom, co váš pes potřebuje. Termíny mám obvykle dva až tři týdny dopředu, před Vánoci i déle.
          - paragraph [ref=f32e310]: Nezvedám? Během stříhání se věnuju psovi. Prozvoňte mě a ozvu se, jakmile dostříhám.
        - listitem [ref=f32e311]:
          - generic [aria-hidden] [ref=f32e312]: "2"
          - heading "Co si připravte k telefonu" [level=3] [ref=f32e313]
          - paragraph [ref=f32e314]: "Ušetří nám to oběma pár minut a vám hlavně přesnější cenu a termín:"
          - list [ref=f32e315]:
            - listitem [ref=f32e316]: plemeno a jméno psa, přibližná váha
            - listitem [ref=f32e317]: kdy byl naposledy stříhaný
            - listitem [ref=f32e318]: jak snáší fén, strojek a cizí lidi
            - listitem [ref=f32e319]: jestli je někde zacuchaný
            - listitem [ref=f32e320]: zdravotní omezení, alergie, kožní problémy
            - listitem [ref=f32e321]: jestli je fena hárající nebo pes po operaci
        - listitem [ref=f32e322]:
          - generic [aria-hidden] [ref=f32e323]: "3"
          - heading "Návštěva" [level=3] [ref=f32e324]
          - paragraph [ref=f32e325]: Psa si prohlédnu, potvrdím cenu a pustím se do práce. Koupel a fén trvá 45 až 90 minut, kompletní střih 1,5 až 3 hodiny. V salonu je vždycky jen jeden pes.
          - paragraph [ref=f32e326]: S sebou nic nepotřebujete – jen vodítko a obojek. Před návštěvou psa prosím vyvenčete.
        - listitem [ref=f32e327]:
