  - generic [ref=f5e171]:
    - heading "Co se mění" [level=2] [ref=f5e173]
    - generic [ref=f5e174]:
      - generic [ref=f5e175]:
        - generic [ref=f5e176]: Oprava
        - paragraph [ref=f5e178]:
          - text: Telefonní tlačítko se přestane roztahovat. Selektor
          - code [ref=f5e179]: .footer__top > div > a
          - text: (specificita 0‑1‑2) přebíjí
          - code [ref=f5e180]: .footer__cta
          - text: (0‑1‑0), takže tlačítko dostane
          - code [ref=f5e181]: "display: block"
          - text: ", roztáhne se na 459 px a ikona vypadne z řádku. Odkazům dám vlastní třídu"
          - code [ref=f5e182]: .footer__link
          - text: a ten selektor zruším – záplata přes
          - code [ref=f5e183]: :not()
          - text: by past nechala nastraženou.
      - generic [ref=f5e184]:
        - generic [ref=f5e185]: Sloupce
        - paragraph [ref=f5e187]: "Ze čtyř na tři: Značka (logo, adresa, otevírací doba, telefon), Služby a Navigace. Sloupce „Salon“ a „Než přijedete“ končí – byly to vymyšlené kategorie, které se musely vycpat, aby mřížka nezela prázdnotou."
      - generic [ref=f5e188]:
        - generic [ref=f5e189]: Duplicity
        - generic [ref=f5e190]:
          - paragraph [ref=f5e191]: "Čtyři odkazy mířily tam, kam už vedl odkaz o řádek výš:"
          - generic [ref=f5e192]:
            - generic [ref=f5e193]:
              - generic [ref=f5e194]: Co si připravit k telefonu
              - generic [ref=f5e195]: "→ #jak-to-probiha, stejně jako „Jak to probíhá“"
            - generic [ref=f5e196]:
              - generic [ref=f5e197]: Zacuchaná srst
              - generic [ref=f5e198]: "→ #dotazy, stejně jako „Časté dotazy“"
            - generic [ref=f5e199]:
              - generic [ref=f5e200]: Rezervace a storno
              - generic [ref=f5e201]: "→ #dotazy, kde to stejně je"
            - generic [ref=f5e202]:
              - generic [ref=f5e203]: Před a po
              - generic [ref=f5e204]: → přejmenováno na „Galerie“ podle lišty
      - generic [ref=f5e205]:
        - generic [ref=f5e206]: Spodní řádek
        - generic [ref=f5e207]:
          - paragraph [ref=f5e208]: "Ze dvou řádků jeden. „Sídlo: Dr. Janského 668“ opakovalo slovo od slova adresu salonu o dva řádky výš – popisek v levém sloupci proto zní „Salon a sídlo“ a adresa je na stránce jen jednou."
          - paragraph [ref=f5e209]: Právní údaje zůstávají, jen se zhustily. Přibylo „zapsána v živnostenském rejstříku“ – § 435 občanského zákoníku ho po webu podnikatele chce a v patičce dosud chyběl. IČO se nikam nestěhuje, je pořád tam, kde bylo.
      - generic [ref=f5e210]:
        - generic [ref=f5e211]: Vpravo dole
        - paragraph [ref=f5e213]: "Místo dvou odkazů Realizace webu: FuxaStudio, otevře se v nové kartě. Zásady zpracování osobních údajů odcházejí: web nemá formulář, cookies ani analytiku, objednává se telefonem, takže není co popisovat. Kdyby přibyl formulář, pixel nebo měření návštěvnosti, musí se odkaz vrátit."
      - generic [ref=f5e214]:
        - generic [ref=f5e215]: Telefon
        - generic [ref=f5e216]:
          - paragraph [ref=f5e217]:
            - text: Číslo z patičky nemizí ani v jedné variantě – je to pořád
            - code [ref=f5e218]: "tel:"
            - text: odkaz, mění se jen rámeček. Přepni si to nahoře.
          - paragraph [ref=f5e219]:
            - text: Tlačítko je
            - code [ref=f5e220]: btn btn--light btn--sm
            - text: ", obtažená pilulka v krémové – nepřehlédnutelná, jistý dotykový cíl. Text sází číslo na 1,5 rem v Baloo 2 se svislým paddingem, aby se na mobilu pořád dalo trefit."
          - paragraph [ref=f5e221]:
            - text: "Můj hlas patří textu: čtyřicet pixelů nad patičkou je plné zelené tlačítko v"
            - code [ref=f5e222]: "#objednat"
            - text: a na mobilu k tomu ještě callbar, takže pilulka v patičce je třetí v řadě a čte se jako ozvěna. Ale je to tvoje značka – rozhodni okem.
      - generic [ref=f5e223]:
        - generic [ref=f5e224]: Reveal
        - paragraph [ref=f5e226]:
          - text: Nižší patička znamená, že efekt odhalování zabere i na kratších oknech. Podmínka v
          - code [ref=f5e227]: main.js
          - text: zní
          - code [ref=f5e228]: footerH + waveH + 24 ≤ innerHeight
