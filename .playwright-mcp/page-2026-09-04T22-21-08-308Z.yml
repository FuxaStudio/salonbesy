          - heading "Zavoláte" [level=3] [ref=f22e308]
          - paragraph [ref=f22e309]: Objednáváme se jedině telefonicky, ať se hned domluvíme na tom, co váš pes potřebuje. Termíny máme obvykle dva až tři týdny dopředu, před Vánoci i déle.
          - paragraph [ref=f22e310]: Nezvedáme? Během stříhání se věnujeme psovi. Prozvoňte nás a ozveme se, jakmile dostříháme.
        - listitem [ref=f22e311]:
          - generic [aria-hidden] [ref=f22e312]: "2"
          - heading "Co si připravte k telefonu" [level=3] [ref=f22e313]
          - paragraph [ref=f22e314]: "Ušetří nám to oběma pár minut a vám hlavně přesnější cenu a termín:"
          - list [ref=f22e315]:
