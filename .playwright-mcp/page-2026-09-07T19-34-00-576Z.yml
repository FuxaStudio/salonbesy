        - heading [level=2] [ref=f7e284]:
          - text: Jak to u mě
          - emphasis [ref=f7e285]: probíhá
        - paragraph [ref=f7e286]: Většina lidí mi volá poprvé a neví, co čekat. Tak ať je jasno předem.
      - list [ref=f7e287]:
        - listitem [ref=f7e288]:
          - generic [aria-hidden] [ref=f7e289]: "1"
          - heading "Zavoláte" [level=3] [ref=f7e290]
          - paragraph [ref=f7e291]: Objednávky beru jedině telefonicky, ať se hned domluvíme na tom, co váš pes potřebuje. Termíny mám obvykle dva až tři týdny dopředu, před Vánoci i déle.
          - paragraph [ref=f7e292]: Nezvedám? Během stříhání se věnuju psovi. Prozvoňte mě a ozvu se, jakmile dostříhám.
        - listitem [ref=f7e293]:
          - generic [aria-hidden] [ref=f7e294]: "2"
          - heading "Co si připravte k telefonu" [level=3] [ref=f7e295]
          - paragraph [ref=f7e296]: "Ušetří nám to oběma pár minut a vám hlavně přesnější cenu a termín:"
          - list [ref=f7e297]:
            - listitem [ref=f7e298]: plemeno a jméno psa, přibližná váha
            - listitem [ref=f7e299]: kdy byl naposledy stříhaný
            - listitem [ref=f7e300]: jak snáší fén, strojek a cizí lidi
            - listitem [ref=f7e301]: jestli je někde zacuchaný
            - listitem [ref=f7e302]: zdravotní omezení, alergie, kožní problémy
            - listitem [ref=f7e303]: jestli je fena hárající nebo pes po operaci
        - listitem [ref=f7e304]:
          - generic [aria-hidden] [ref=f7e305]: "3"
          - heading "Návštěva" [level=3] [ref=f7e306]
          - paragraph [ref=f7e307]: Psa si prohlédnu, potvrdím cenu a pustím se do práce. Koupel a fén trvá 45 až 90 minut, kompletní střih 1,5 až 3 hodiny. V salonu je vždycky jen jeden pes.
          - paragraph [ref=f7e308]: S sebou nic nepotřebujete, jen vodítko a obojek. Před návštěvou psa prosím vyvenčete.
        - listitem [ref=f7e309]:
