        - heading [level=2] [ref=f7e140]:
          - text: Moje služby a
          - emphasis [ref=f7e141]: ceník
        - paragraph [ref=f7e142]: Od uklidňující koupele po precizní střih, všechno s ohledem na zdraví a pohodu vašeho chlupáče. U každé služby najdete orientační cenu. O výsledné částce rozhoduje typ a stav srsti a čas, který si pes vyžádá, ne jeho velikost. Pracuju výhradně na objednávku, aby měl každý pes moji plnou pozornost.
