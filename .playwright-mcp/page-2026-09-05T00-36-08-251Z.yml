          - heading "Zavoláte" [level=3] [ref=f36e295]
          - paragraph [ref=f36e296]: Objednávky beru jedině telefonicky, ať se hned domluvíme na tom, co váš pes potřebuje. Termíny mám obvykle dva až tři týdny dopředu, před Vánoci i déle.
          - paragraph [ref=f36e297]: Nezvedám? Během stříhání se věnuju psovi. Prozvoňte mě a ozvu se, jakmile dostříhám.
        - listitem [ref=f36e298]:
          - generic [aria-hidden] [ref=f36e299]: "2"
          - heading "Co si připravte k telefonu" [level=3] [ref=f36e300]
          - paragraph [ref=f36e301]: "Ušetří nám to oběma pár minut a vám hlavně přesnější cenu a termín:"
