        - heading [level=2] [ref=f6e297]:
          - text: Jak to u mě
          - emphasis [ref=f6e298]: probíhá
        - paragraph [ref=f6e299]: Většina lidí mi volá poprvé a neví, co čekat. Tak ať je jasno předem.
      - list [ref=f6e300]:
        - listitem [ref=f6e301]:
          - generic [aria-hidden] [ref=f6e302]: "1"
          - heading "Zavoláte" [level=3] [ref=f6e303]
          - paragraph [ref=f6e304]: Objednávky beru jedině telefonicky, ať se hned domluvíme na tom, co váš pes potřebuje. Termíny mám obvykle dva až tři týdny dopředu, před Vánoci i déle.
          - paragraph [ref=f6e305]: Nezvedám? Během stříhání se věnuju psovi. Prozvoňte mě a ozvu se, jakmile dostříhám.
        - listitem [ref=f6e306]:
          - generic [aria-hidden] [ref=f6e307]: "2"
          - heading "Co si připravte k telefonu" [level=3] [ref=f6e308]
          - paragraph [ref=f6e309]: "Ušetří nám to oběma pár minut a vám hlavně přesnější cenu a termín:"
          - list [ref=f6e310]:
            - listitem [ref=f6e311]: plemeno a jméno psa, přibližná váha
            - listitem [ref=f6e312]: kdy byl naposledy stříhaný
