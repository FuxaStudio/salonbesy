          - heading "Vyzvednutí" [level=3] [ref=f6e324]
          - paragraph [ref=f6e325]: Zavolám vám, jakmile budu hotová. Řeknu vám, co jsem na psovi našla, jak o srst pečovat doma a kdy přijít příště. Platí se hotově nebo QR platbou.
