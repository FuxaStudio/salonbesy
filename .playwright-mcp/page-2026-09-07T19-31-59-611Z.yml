            - listitem [ref=f6e314]: jestli je někde zacuchaný
            - listitem [ref=f6e315]: zdravotní omezení, alergie, kožní problémy
            - listitem [ref=f6e316]: jestli je fena hárající nebo pes po operaci
        - listitem [ref=f6e317]:
