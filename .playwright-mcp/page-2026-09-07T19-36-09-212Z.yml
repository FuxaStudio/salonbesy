          - heading "Návštěva" [level=3] [ref=f10e306]
          - paragraph [ref=f10e307]: Psa si prohlédnu, potvrdím cenu a pustím se do práce. Koupel a fén trvá 45 až 90 minut, kompletní střih 1,5 až 3 hodiny. V salonu je vždycky jen jeden pes.
          - paragraph [ref=f10e308]: S sebou nic nepotřebujete, jen vodítko a obojek. Před návštěvou psa prosím vyvenčete.
        - listitem [ref=f10e309]:
