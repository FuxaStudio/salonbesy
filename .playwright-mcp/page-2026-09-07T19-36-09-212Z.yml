          - emphasis [ref=f10e285]: probíhá
        - paragraph [ref=f10e286]: Většina lidí mi volá poprvé a neví, co čekat. Tak ať je jasno předem.
      - list [ref=f10e287]:
        - listitem [ref=f10e288]:
          - generic [aria-hidden] [ref=f10e289]: "1"
          - heading "Zavoláte" [level=3] [ref=f10e290]
          - paragraph [ref=f10e291]: Objednávky beru jedině telefonicky, ať se hned domluvíme na tom, co váš pes potřebuje. Termíny mám obvykle dva až tři týdny dopředu, před Vánoci i déle.
          - paragraph [ref=f10e292]: Nezvedám? Během stříhání se věnuju psovi. Prozvoňte mě a ozvu se, jakmile dostříhám.
        - listitem [ref=f10e293]:
          - generic [aria-hidden] [ref=f10e294]: "2"
          - heading "Co si připravte k telefonu" [level=3] [ref=f10e295]
          - paragraph [ref=f10e296]: "Ušetří nám to oběma pár minut a vám hlavně přesnější cenu a termín:"
          - list [ref=f10e297]:
