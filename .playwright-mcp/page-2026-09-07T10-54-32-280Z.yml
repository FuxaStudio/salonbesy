          - emphasis [ref=f1e296]: probíhá
        - paragraph [ref=f1e297]: Většina lidí mi volá poprvé a neví, co čekat. Tak ať je jasno předem.
      - list [ref=f1e298]:
        - listitem [ref=f1e299]:
          - generic [aria-hidden] [ref=f1e300]: "1"
          - heading "Zavoláte" [level=3] [ref=f1e301]
          - paragraph [ref=f1e302]: Objednávky beru jedině telefonicky, ať se hned domluvíme na tom, co váš pes potřebuje. Termíny mám obvykle dva až tři týdny dopředu, před Vánoci i déle.
          - paragraph [ref=f1e303]: Nezvedám? Během stříhání se věnuju psovi. Prozvoňte mě a ozvu se, jakmile dostříhám.
        - listitem [ref=f1e304]:
          - generic [aria-hidden] [ref=f1e305]: "2"
          - heading "Co si připravte k telefonu" [level=3] [ref=f1e306]
          - paragraph [ref=f1e307]: "Ušetří nám to oběma pár minut a vám hlavně přesnější cenu a termín:"
          - list [ref=f1e308]:
            - listitem [ref=f1e309]: plemeno a jméno psa, přibližná váha
            - listitem [ref=f1e310]: kdy byl naposledy stříhaný
            - listitem [ref=f1e311]: jak snáší fén, strojek a cizí lidi
            - listitem [ref=f1e312]: jestli je někde zacuchaný
            - listitem [ref=f1e313]: zdravotní omezení, alergie, kožní problémy
            - listitem [ref=f1e314]: jestli je fena hárající nebo pes po operaci
        - listitem [ref=f1e315]:
          - generic [aria-hidden] [ref=f1e316]: "3"
          - heading "Návštěva" [level=3] [ref=f1e317]
          - paragraph [ref=f1e318]: Psa si prohlédnu, potvrdím cenu a pustím se do práce. Koupel a fén trvá 45 až 90 minut, kompletní střih 1,5 až 3 hodiny. V salonu je vždycky jen jeden pes.
          - paragraph [ref=f1e319]: S sebou nic nepotřebujete – jen vodítko a obojek. Před návštěvou psa prosím vyvenčete.
        - listitem [ref=f1e320]:
          - generic [aria-hidden] [ref=f1e321]: "4"
          - heading "Vyzvednutí" [level=3] [ref=f1e322]
          - paragraph [ref=f1e323]: Zavolám vám, jakmile budu hotová. Řeknu vám, co jsem na psovi našla, jak o srst pečovat doma a kdy přijít příště. Platí se hotově nebo QR platbou.
