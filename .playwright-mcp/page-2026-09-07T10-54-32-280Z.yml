          - paragraph [ref=f1e217]: "Neklidný pes: příplatek od 200 Kč, když je potřeba pracovat pomaleji a po částech."
          - paragraph [ref=f1e218]: "Nedostavení se bez omluvy: 50 % ceny objednané služby."
        - paragraph [ref=f1e219]:
