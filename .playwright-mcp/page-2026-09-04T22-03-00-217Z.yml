          - heading "Zavoláte" [level=3] [ref=f17e295]
          - paragraph [ref=f17e296]: Objednáváme se jedině telefonicky, ať se hned domluvíme na tom, co váš pes potřebuje. Termíny máme obvykle dva až tři týdny dopředu, před Vánoci i déle.
          - paragraph [ref=f17e297]: Nezvedáme? Během stříhání se věnujeme psovi. Prozvoňte nás a ozveme se, jakmile dostříháme.
        - listitem [ref=f17e298]:
          - generic [aria-hidden] [ref=f17e299]: "2"
          - heading "Co si připravte k telefonu" [level=3] [ref=f17e300]
          - paragraph [ref=f17e301]: "Ušetří nám to oběma pár minut a vám hlavně přesnější cenu a termín:"
          - list [ref=f17e302]:
