          - emphasis [ref=f1e299]: probíhá
        - paragraph [ref=f1e300]: Většina lidí mi volá poprvé a neví, co čekat. Tak ať je jasno předem.
      - list [ref=f1e301]:
        - listitem [ref=f1e302]:
          - generic [aria-hidden] [ref=f1e303]: "1"
          - heading "Zavoláte" [level=3] [ref=f1e304]
          - paragraph [ref=f1e305]: Objednávky beru jedině telefonicky, ať se hned domluvíme na tom, co váš pes potřebuje. Termíny mám obvykle dva až tři týdny dopředu, před Vánoci i déle.
          - paragraph [ref=f1e306]: Nezvedám? Během stříhání se věnuju psovi. Prozvoňte mě a ozvu se, jakmile dostříhám.
        - listitem [ref=f1e307]:
          - generic [aria-hidden] [ref=f1e308]: "2"
          - heading "Co si připravte k telefonu" [level=3] [ref=f1e309]
          - paragraph [ref=f1e310]: "Ušetří nám to oběma pár minut a vám hlavně přesnější cenu a termín:"
