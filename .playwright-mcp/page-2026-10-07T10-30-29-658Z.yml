            - text: Salon vede
            - emphasis [ref=f1e45]: Marie
          - paragraph [ref=f1e46]: "Jmenuju se Marie Kasanová a nabízím jednotlivé i kompletní úpravy psího zevnějšku podle vašich přání a představ: stříhání, koupání, trimování, vyčesávání i výstavní úpravy, klidně podle fotky, kterou mi přinesete. Uvítám vás v domácím prostředí a upravím všechny psy od čivavy až po bernardýna, od obyčejného oříška až po výstavní krasavce, kteří se chystají na světové soutěže."
          - paragraph [ref=f1e47]: Nemám ráda prázdná slova, radši koukám na výsledky, a ty za mou prací stojí. Profesi se věnuju přes třicet let, jezdím na výstavy a soutěže u nás i v cizině, za úpravu psů jsem získala přes 70 pohárů a titulů a články o mé práci vyšly i v německých a francouzských časopisech.
          - paragraph [ref=f1e48]: Věřím, že budete spokojení a že se budeme vídat i dál, abychom z vašich čtyřnohých přátel dělali opravdové krasavce a elegány.
