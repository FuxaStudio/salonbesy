          - heading "Vyzvednutí" [level=3] [ref=f1e325]
          - paragraph [ref=f1e326]: Zavolám vám, jakmile budu hotová. Řeknu vám, co jsem na psovi našla, jak o srst pečovat doma a kdy přijít příště. Platí se hotově nebo QR platbou.
