            - listitem [ref=f7e320]: zdravotní omezení, alergie, kožní problémy
            - listitem [ref=f7e321]: jestli je fena hárající nebo pes po operaci
        - listitem [ref=f7e322]:
          - generic [aria-hidden] [ref=f7e323]: "3"
          - heading "Návštěva" [level=3] [ref=f7e324]
          - paragraph [ref=f7e325]: Psa si prohlédneme, potvrdíme cenu a pustíme se do práce. Koupel a fén trvá 45 až 90 minut, kompletní střih 1,5 až 3 hodiny. V salonu je vždycky jen jeden pes.
          - paragraph [ref=f7e326]: S sebou nic nepotřebujete – jen vodítko a obojek. Před návštěvou psa prosím vyvenčete.
        - listitem [ref=f7e327]:
