          - generic [aria-hidden] [ref=f7e307]: "1"
          - heading "Zavoláte" [level=3] [ref=f7e308]
          - paragraph [ref=f7e309]: Objednáváme se jedině telefonicky, ať se hned domluvíme na tom, co váš pes potřebuje. Termíny máme obvykle dva až tři týdny dopředu, před Vánoci i déle.
          - paragraph [ref=f7e310]: Nezvedáme? Během stříhání se věnujeme psovi. Prozvoňte nás a ozveme se, jakmile dostříháme.
        - listitem [ref=f7e311]:
          - generic [aria-hidden] [ref=f7e312]: "2"
          - heading "Co si připravte k telefonu" [level=3] [ref=f7e313]
          - paragraph [ref=f7e314]: "Ušetří nám to oběma pár minut a vám hlavně přesnější cenu a termín:"
          - list [ref=f7e315]:
            - listitem [ref=f7e316]: plemeno a jméno psa, přibližná váha
            - listitem [ref=f7e317]: kdy byl naposledy stříhaný
