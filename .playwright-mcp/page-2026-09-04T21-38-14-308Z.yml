          - heading "Vyzvednutí" [level=3] [ref=f7e329]
          - paragraph [ref=f7e330]: Zavoláme vám, jakmile budeme hotoví. Řekneme, co jsme na psovi našli, jak o srst pečovat doma a kdy přijít příště. Platí se hotově nebo QR platbou.
