          - generic [aria-hidden] [ref=f12e307]: "1"
          - heading "Zavoláte" [level=3] [ref=f12e308]
          - paragraph [ref=f12e309]: Objednáváme se jedině telefonicky, ať se hned domluvíme na tom, co váš pes potřebuje. Termíny máme obvykle dva až tři týdny dopředu, před Vánoci i déle.
          - paragraph [ref=f12e310]: Nezvedáme? Během stříhání se věnujeme psovi. Prozvoňte nás a ozveme se, jakmile dostříháme.
        - listitem [ref=f12e311]:
          - generic [aria-hidden] [ref=f12e312]: "2"
          - heading "Co si připravte k telefonu" [level=3] [ref=f12e313]
          - paragraph [ref=f12e314]: "Ušetří nám to oběma pár minut a vám hlavně přesnější cenu a termín:"
          - list [ref=f12e315]:
            - listitem [ref=f12e316]: plemeno a jméno psa, přibližná váha
            - listitem [ref=f12e317]: kdy byl naposledy stříhaný
