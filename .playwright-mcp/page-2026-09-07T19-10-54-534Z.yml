      - generic [ref=f4e195]:
        - generic [ref=f4e196]: Spodní řádek
        - generic [ref=f4e197]:
          - paragraph [ref=f4e198]: "Ze dvou řádků jeden. „Sídlo: Dr. Janského 668“ opakovalo slovo od slova adresu salonu o dva řádky výš – popisek v levém sloupci proto zní „Salon a sídlo“ a adresa je na stránce jen jednou."
          - paragraph [ref=f4e199]: Právní údaje zůstávají, jen se zhustily. Přibylo „zapsána v živnostenském rejstříku“ – § 435 občanského zákoníku ho po webu podnikatele chce a v patičce dosud chyběl. IČO se nikam nestěhuje, je pořád tam, kde bylo.
      - generic [ref=f4e200]:
        - generic [ref=f4e201]: Vpravo dole
        - paragraph [ref=f4e203]: "Místo dvou odkazů Realizace webu: FuxaStudio, otevře se v nové kartě. Zásady zpracování osobních údajů odcházejí: web nemá formulář, cookies ani analytiku, objednává se telefonem, takže není co popisovat. Kdyby přibyl formulář, pixel nebo měření návštěvnosti, musí se odkaz vrátit."
