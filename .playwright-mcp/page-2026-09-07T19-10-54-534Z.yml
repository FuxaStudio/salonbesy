        - paragraph [ref=f4e207]:
          - text: Zůstává tlačítkem, jak jsi chtěl – jen konečně vykreslené správně, v přirozené šířce podle obsahu. Provedení je pořád
          - code [ref=f4e208]: btn btn--light btn--sm
          - text: ", tedy obtažená pilulka v krémové."
      - generic [ref=f4e209]:
