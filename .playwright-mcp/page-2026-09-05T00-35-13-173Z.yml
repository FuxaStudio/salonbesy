          - heading "Vyzvednutí" [level=3] [ref=f28e329]
          - paragraph [ref=f28e330]: Zavolám vám, jakmile budu hotová. Řeknu vám, co jsem na psovi našla, jak o srst pečovat doma a kdy přijít příště. Platí se hotově nebo QR platbou.
