          - heading "Zavoláte" [level=3] [ref=f1e297]
          - paragraph [ref=f1e298]: Objednávky beru jedině telefonicky, ať se hned domluvíme na tom, co váš pes potřebuje. Termíny mám obvykle dva až tři týdny dopředu, před Vánoci i déle.
          - paragraph [ref=f1e299]: Nezvedám? Během stříhání se věnuju psovi. Prozvoňte mě a ozvu se, jakmile dostříhám.
        - listitem [ref=f1e300]:
          - generic [aria-hidden] [ref=f1e301]: "2"
