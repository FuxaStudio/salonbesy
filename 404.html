<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stránka nenalezena · Besy, psí salon Chrudim</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#e7ecdb">
  <!-- Stránka je schválně soběstačná: styly, logo i tvary jsou vložené přímo.
       GitHub Pages ji servíruje na libovolné chybné adrese (/neco/hlubsiho/),
       takže relativní cesta css/styles.css by se rozbila a absolutní /css/…
       nefunguje, dokud web běží v podadresáři fuxastudio.github.io/salonbesy/.
       Barvy a písma odpovídají :root v css/styles.css – při změně palety
       přepsat i tady. -->
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600..700&family=Karla:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-50: #f4f7ee;
      --primary-100: #e7ecdb;
      --primary-500: #6d854a;
      --primary-600: #5c733d;
      --primary-700: #485932;
      --cream: #fff9f1;
      --dark: #3a3c36;
      --grey: #646b5b;
      --logo-ink: #111111;
      --font-display: "Baloo 2", "Segoe UI", sans-serif;
      --font-body: "Karla", "Segoe UI", sans-serif;
      --gutter: 2.5rem;
    }
    *, *::before, *::after { box-sizing: border-box; }
    * { margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column;
      font-family: var(--font-body); font-size: 1rem; line-height: 1.65;
      color: #3b3b3b; background: var(--primary-100);
      overflow-x: clip; -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    svg { display: block; }
    :where(a):focus-visible { outline: 2px solid var(--primary-600); outline-offset: 3px; }

    .bar { padding: 1rem var(--gutter); }
    .logo { display: inline-flex; align-items: center; gap: .6rem; }
    .logo svg { height: 3rem; width: auto; }
    .logo span {
      font-family: var(--font-display); font-weight: 600;
      font-size: 1.85rem; letter-spacing: -.03em; line-height: 1; color: var(--logo-ink);
    }

    .lost {
      flex: 1;
      width: min(100% - var(--gutter) * 2, 68rem); margin-inline: auto;
      display: grid; grid-template-columns: 1.1fr .9fr; align-items: center;
      gap: clamp(2rem, 5vw, 5rem);
      padding-block: clamp(2rem, 6vw, 5rem);
    }
    .eyebrow { font-size: .95rem; font-weight: 500; color: var(--primary-700); margin-bottom: .75rem; }
    h1 {
      font-family: var(--font-display); font-weight: 700; color: var(--dark);
      font-size: clamp(2.6rem, 5.6vw, 4.2rem); line-height: 1.18;
      text-wrap: balance;
    }
    /* Baloo 2 nemá kurzívu – bez font-style by ji prohlížeč zkosil sám */
    h1 em { font-style: normal; color: var(--primary-500); }
    .lead { font-size: 1.15rem; color: var(--grey); max-width: 34rem; margin-top: 1.25rem; }

    .btn-row { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 2rem; }
    .btn {
      display: inline-flex; align-items: center; gap: .5rem;
      padding: .85rem 1.7rem; border-radius: 2.5rem;
      border: 1.5px solid var(--primary-500);
      font-weight: 500; font-size: .95rem; line-height: 1; white-space: nowrap;
      transition: background-color .25s ease, transform .25s ease, box-shadow .25s ease;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(109, 133, 74, .18); }
    .btn svg { width: 1rem; height: 1rem; flex: none; }
    .btn--primary { background: var(--primary-600); border-color: var(--primary-600); color: #fff; }
    .btn--primary:hover { background: var(--primary-700); border-color: var(--primary-700); }
    .btn--ghost { color: var(--primary-700); }
    .btn--ghost:hover { background: var(--primary-50); }
    .btn__verb { display: none; }

    /* Tvar za číslem je Blobs/Masks/za_obrz.svg, akcenty z Blobs/ – vložené
       doslova, geometrie se needituje. */
    .art { position: relative; width: min(100%, 26rem); justify-self: center; aspect-ratio: 491 / 457; }
    .art__blob { position: absolute; inset: 0; width: 100%; height: 100%; }
    .art__num {
      position: absolute; inset: 0; display: grid; place-items: center;
      padding-top: 12%;
      font-family: var(--font-display); font-weight: 700; line-height: 1;
      font-size: clamp(5rem, 13vw, 8.5rem); color: var(--cream);
    }
    .art__acc { position: absolute; height: auto; }
    .art__acc--heart { left: -6%; top: 14%; width: 17%; transform: rotate(-14deg); }
    .art__acc--dots { left: 4%; top: 64%; width: 19%; }
    .art__acc--dash { left: 90%; top: 70%; width: 6%; transform: rotate(-25deg); }

    @media (max-width: 768px) {
      .lost { grid-template-columns: 1fr; }
      .art { order: -1; width: min(70%, 18rem); }
      .btn__verb { display: inline; }
      .btn__num { display: none; }
    }
    @media (max-width: 600px) { :root { --gutter: 1.25rem; } }
    @media (max-width: 480px) {
      .btn-row .btn { flex: 1 1 100%; justify-content: center; }
    }
    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
      .btn:hover { transform: none; }
    }
  </style>
</head>
<body>

    <span>Besy</span>
  </a>
</header>

</main>

<script>
  // Dokud web běží na fuxastudio.github.io/salonbesy/, vedl by odkaz "/" na kořen
  // github.io, ne na úvod salonu. S vlastní doménou se podmínka nesplní a zůstane "/".
  if (/\.github\.io$/.test(location.hostname)) {
    var base = '/' + location.pathname.split('/')[1] + '/';
    document.querySelectorAll('[data-home]').forEach(function (a) { a.href = base; });
  }
</script>
